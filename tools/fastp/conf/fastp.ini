##############################################
## fastp configuration file
## Read by /src/fastp.sh as KEY=VALUE lines.
## An empty value uses the default.
##############################################

# Read 1 (FASTQ, gzipped or not)
fastq_forward=
# Read 2
fastq_reverse=
# Output folder
DATA_OUT=
# Name of trimmed read 1. Default: trimmed_<name of read 1>
forward_filename=
# Name of trimmed read 2. Default: trimmed_<name of read 2>
reverse_filename=
# Extra fastp options, e.g. -w 8 --detect_adapter_for_pe
PARAMETERS=
