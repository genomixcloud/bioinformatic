##############################################
## CheckM configuration file
## Read by /src/checkm.sh as KEY=VALUE lines.
## An empty value uses the default.
##############################################

# Folder with one FASTA file per genome
DATA_IN=
# Output folder (CheckM creates it)
DATA_OUT=
# Extension of the genome files (default: fasta)
EXTENSION=fasta
# CheckM database folder (default: /data/checkm_db)
CHECKM_DB=/data/checkm_db
# Extra options for checkm tree (default: --reduced_tree --threads 8)
PARAMETERS=
